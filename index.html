<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/mutram-web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mutram: your money, health, home, travel and reading in one place, with Nanban to help.">
  <meta name="google-signin-client_id" content="227545631327-rh0cjbp0h6idgeo9499upjjmmh99ppvq.apps.googleusercontent.com">
  <meta name="theme-color" content="#0B1220">

  <!-- Installed on an iPhone's home screen (Safari: Share, Add to Home Screen). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mutram">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Mutram</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1220; }
    /* While Mutram loads: its mark, glowing. */
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; animation: glow 1.6s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="Mutram"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
